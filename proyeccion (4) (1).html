<!--
  ESPEJO HILADORAS · versión solo proyección
  Abrir en Chrome y presionar F (pantalla completa). Atajos de prueba:
    1 · 2 · 3  ponen un accesorio     Esc  lo retira
    (el color de fondo cambia solo con cada accesorio: collar petróleo · bolso vino · pulsera morado)   F    pantalla completa
  Lector Arduino (USB): botón "Conectar lector" abajo a la izquierda, o tecla C (Chrome/Edge). El Arduino envía por serial CHIP-COLLAR / CHIP-BOLSO / CHIP-PULSERA / RETIRAR.
  También se puede llamar a mano:  colocarAccesorio('CHIP-...')  y  retirarAccesorio()
  Si el chip parpadea, retirarAccesorio() espera RETIRO_DEMORA ms antes de quitar el proceso (Esc lo retira al tiro).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espejo Hiladoras · Proyección</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Identidad Hiladoras (moodboard): caligrafía + serif editorial + mono, paleta de lana y borde de punto cruz.
   Concepto: la proyección es un espejo de tocador en arco. Al poner un accesorio en la mesa,
   aparece "reflejado" y alrededor se despliega su proceso.
   Todo lo editable (paleta, tipografías, textos, tiempos) está arriba: variables CSS y constantes JS. */
:root {
  color-scheme: dark;
  /* ← PALETA (del moodboard) */
  --negro: #1A1A1A; --crema: #F3EBE3; --gris: #A9809E;
  --naranja-1: #E48B4E; --naranja-2: #E8A862; --naranja-3: #EEBB6E;       /* naranjas */
  --rojo-1: #86304B;    --rojo-2: #B34E53;    --rojo-3: #C7636E;          /* vinos y rojos */
  --morado-1: #4D3458;  --morado-2: #875A87;  --morado-3: #A9809E;        /* morados */
  --petroleo-1: #2B4B5A; --petroleo-2: #3D6F83; --petroleo-3: #6898A4;    /* azules petróleo */
  --turquesa: var(--petroleo-3); --magenta: var(--rojo-1); --burdeo: var(--rojo-1); --coral: var(--naranja-1); --arena: var(--naranja-3);
  --bg: #FFFFFF; --surface: #242120; --surface-2: #2E2A28;
  --ink: var(--crema); --ink-2: var(--gris); --line: #3C3835; --focus: #7EC0D0;
  /* ← TIPOGRAFÍAS */
  --f-script: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;   /* logo */
  --f-title: 'Playfair Display', Georgia, serif;                               /* títulos */
  --f-text: 'EB Garamond', Georgia, serif;                                     /* párrafos */
  --f-mono: 'DM Mono', ui-monospace, Menlo, monospace;                         /* etiquetas */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { overflow: hidden; cursor: none; }
#btnLector { position: fixed; left: 12px; bottom: 12px; z-index: 50; cursor: pointer; font: 500 12px 'DM Mono', monospace; letter-spacing: .06em; color: #F3EBE3; background: rgba(26,26,26,.55); border: 1px solid rgba(243,235,227,.35); border-radius: 999px; padding: 7px 14px; opacity: .55; transition: opacity .2s; }
#btnLector:hover, #btnLector:focus-visible { opacity: 1; }
#btnLector.ok { opacity: 0; pointer-events: none; }
.pantalla { position: fixed; inset: 0; background: #fff; }
.pantalla .stage { border: 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 18px/1.5 var(--f-text); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }


/* ---------- Proyección ---------- */
.stage {
  --acc: var(--morado-3);
  /* tema oscuro (por defecto) */
  --m: 2.6cqw;   /* margen de seguridad (≈1 cm) a cada lado de la proyección */
  --fit: 1;      /* el script lo baja si un texto largo no cabe */
  --t-title: calc(4.1cqw * var(--fit)); --t-body: calc(1.4cqw * var(--fit)); --t-label: calc(.95cqw * var(--fit)); --t-step: calc(1.3cqw * var(--fit));
  container-type: inline-size; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: linear-gradient(180deg, var(--st-bg1), var(--st-bg2));
  color: var(--st-ink);
}
@property --st-bg1 { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-bg2 { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-title { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-ink { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-ink2 { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-label { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-thread { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-outline { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-fill { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
@property --st-wm { syntax: '<color>'; inherits: true; initial-value: #E8924F; }
.stage { transition: --st-bg1 .9s ease, --st-bg2 .9s ease, --st-title .9s ease, --st-ink .9s ease, --st-ink2 .9s ease, --st-label .9s ease, --st-thread .9s ease, --st-outline .9s ease, --st-fill .9s ease, --st-wm .9s ease; }
/* ← TEMAS: fondo siempre blanco; cada objeto da su color al contenido. */
.stage { --st-bg1: #FFFFFF; --st-bg2: #FFFFFF; --st-line: rgba(42,38,48,.18); --st-title: #E48B4E; --st-ink: #2A2630; --st-ink2: #6B6470; --st-label: #B9602A; --st-thread: #E48B4E; --st-outline: #E48B4E; --st-fill: rgba(228,139,78,.07); --st-wm: rgba(228,139,78,.15); }
.stage.t-witral { --st-bg1: #FFFFFF; --st-bg2: #FFFFFF; --st-line: rgba(42,38,48,.18); --st-title: #86304B; --st-ink: #2A2630; --st-ink2: #6B6470; --st-label: #86304B; --st-thread: #B34E53; --st-outline: #B34E53; --st-fill: rgba(179,78,83,.07); --st-wm: rgba(179,78,83,.13); }
.stage.t-amanopla { --st-bg1: #FFFFFF; --st-bg2: #FFFFFF; --st-line: rgba(42,38,48,.18); --st-title: #4D3458; --st-ink: #2A2630; --st-ink2: #6B6470; --st-label: #875A87; --st-thread: #875A87; --st-outline: #875A87; --st-fill: rgba(135,90,135,.08); --st-wm: rgba(135,90,135,.14); }
.stage.t-petroleo { --st-bg1: #FFFFFF; --st-bg2: #FFFFFF; --st-line: rgba(42,38,48,.18); --st-title: #2B4B5A; --st-ink: #2A2630; --st-ink2: #6B6470; --st-label: #3D6F83; --st-thread: #3D6F83; --st-outline: #3D6F83; --st-fill: rgba(61,111,131,.08); --st-wm: rgba(61,111,131,.14); }
.band { position: absolute; left: var(--m); right: var(--m); z-index: 2; pointer-events: none; }
.band svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
.band.top { top: var(--m); } .band.bot { bottom: var(--m); }
.band { transition: opacity .6s ease; } .stage:not(.activo) .band { opacity: 0; }   /* en espera (Esc) no hay bordes */
.mirror {
  position: absolute; left: 50%; top: calc(50% + 2cqw); transform: translate(-50%, -50%); transition: transform .9s cubic-bezier(.4, 0, .2, 1);
  width: 27.6cqw; height: 36.5cqw;
  border-radius: 13.8cqw 13.8cqw 1.4cqw 1.4cqw;            /* ← arco: mitad superior redonda, base recta (13.8cqw = la mitad del ancho) */
  border: .18cqw solid var(--st-outline);
  background: var(--st-fill);
  display: grid; place-items: center; overflow: hidden;
}
.mirror::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.09) 46%, rgba(255,255,255,.02) 54%, transparent 60%) 0 0 / 260% 100%;
  animation: sheen 11s ease-in-out infinite alternate; }
@keyframes sheen { from { background-position: 90% 0; } to { background-position: 10% 0; } }
.mirror::after, .glow, .band { display: none; }
/* Cámara: el espejo muestra a la persona; al poner un accesorio se achica, la imagen se desenfoca y aparece el objeto con su texto. */
.m-body { position: absolute; inset: 0; display: grid; place-items: center; }
.cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; filter: blur(0); transition: opacity .9s ease, filter .9s ease, transform .9s ease; }
.mirror.cam-on:not(.hay-obj) { transform: translate(-50%, -50%) scale(1.16); }
.mirror.cam-on .cam { opacity: 1; }
.mirror.cam-on.hay-obj .cam { filter: blur(.9cqw) saturate(1.1); transform: scaleX(-1) scale(1.06); }   /* con el objeto: la cámara queda de fondo, desenfocada */
.mirror.cam-on.hay-obj .m-body { background: rgba(255, 255, 255, .22); }
.mirror.cam-on .wait { position: absolute; left: 0; right: 0; bottom: 0; padding: 7cqw 3cqw 2.6cqw; background: linear-gradient(transparent, rgba(20,16,24,.6)); }
.mirror.cam-on .wait p { color: #fff; } .mirror.cam-on .wait .halo { display: none; }
.hay-obj .obj { animation-delay: .45s; }   /* identidad plana: sin brillo ni franjas */
.wm { position: absolute; right: 1cqw; top: 1.5cqw; width: 40cqw; height: auto; color: var(--st-wm); pointer-events: none; z-index: 0; }
/* Resplandor: degradado que se desvanece solo, sin bordes ni cortes. */
.glow { position: absolute; left: 50%; top: 50%; width: 44cqw; height: 54cqw; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 34%, transparent) 0%, color-mix(in srgb, var(--acc) 14%, transparent) 55%, transparent 100%);
  animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .6; } }
.wait { display: grid; gap: 1.4cqw; justify-items: center; text-align: center; color: var(--st-ink2); padding: 0 4cqw; }
.wait .halo { width: 9cqw; height: 4cqw; border-radius: 50%; border: .22cqw dashed var(--st-ink2); opacity: .7; }
.wait p { font: italic 500 calc(var(--t-step) * 1.1)/1.3 var(--f-text); max-width: 14em; }
.obj { width: 72%; display: grid; place-items: center; --c: var(--acc); animation: appear .9s cubic-bezier(.2,.7,.2,1) both; }
.obj.wide { width: 88%; }
.m-box { position: absolute; left: 0; right: 0; bottom: calc(50% + 17.3cqw); text-align: center; pointer-events: none; z-index: 3; }
.aviso { position: absolute; inset: 0; z-index: 50; display: none; place-items: center; text-align: center; padding: 0 8cqw; background: #fff; }
.aviso.on { display: grid; } .aviso p { font: 800 7.5cqw/1.1 var(--f-title); color: var(--st-title); }
.m-foot { position: absolute; left: 0; right: 0; top: calc(50% + 21.4cqw); text-align: center; pointer-events: none; z-index: 3; }
.m-pie b { display: block; font: 800 calc(var(--t-step) * 1.35)/1.15 var(--f-title); color: var(--st-title); }
.m-pie span { display: block; font: italic 400 var(--t-step)/1.3 var(--f-text); color: var(--st-ink2); margin: .3cqw auto 0; max-width: 56cqw; }
.m-title { font: 800 calc(var(--t-title) * .95)/1.1 var(--f-title); color: var(--st-title); white-space: nowrap; }
.obj svg { width: 100%; height: auto; display: block; }
.obj img { width: auto; max-width: 100%; max-height: 33cqw; height: auto; display: block; -webkit-mask-image: linear-gradient(#000 90%, transparent); mask-image: linear-gradient(#000 90%, transparent); }   /* borde inferior suave (la foto de Entrelazados viene cortada) */   /* fotos altas no se salen del espejo */
@keyframes appear { from { opacity: 0; transform: scale(.82); filter: blur(16px); } }   /* el espejo se aclara */

.col { position: absolute; top: 7.8cqw; bottom: 7.8cqw; width: 26cqw; display: flex; flex-direction: column; justify-content: center; gap: 1.9cqw; min-width: 0; z-index: 2; }
.col.left { left: var(--m); align-items: flex-end; text-align: right; }
.col.right { right: var(--m); align-items: flex-start; text-align: left; }
.blk { max-width: 100%; }
.i-title { font: 800 var(--t-title)/1.04 var(--f-title); color: var(--st-title); }
.label { font: italic 500 calc(var(--t-step) * 1.1)/1.2 var(--f-title); color: var(--st-label); margin-bottom: .45cqw; }
.blk p { font: 400 var(--t-step)/1.35 var(--f-text); }
.st { display: block; font: italic 500 calc(var(--t-step) * 1.1)/1.3 var(--f-title); color: var(--st-label); margin-bottom: .45cqw; }
.tj { display: grid; gap: .8cqw; }
.tj b { font: 500 var(--t-step)/1.3 var(--f-title); }
.tj span { display: block; font: 400 var(--t-step)/1.35 var(--f-text); color: var(--st-ink2); }
.pending { color: var(--st-ink2); font-style: italic; }
.threads { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.threads path { fill: none; stroke: var(--st-thread); stroke-width: calc(var(--hilo, 1.4px) * .9); stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.threads path.h2 { opacity: .7; }
.threads circle { fill: var(--st-thread); transform-box: fill-box; transform-origin: center; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
.blk .idle-brand { font: 800 5cqw/1 var(--f-title); color: var(--st-title); white-space: nowrap; }
.blk .idle-sub { font: italic 500 2.4cqw/1.2 var(--f-text); color: var(--st-ink); margin-top: .5cqw; }
.idle-title { font: 800 2.8cqw/1.1 var(--f-title); color: var(--st-title); }
.idle-text { font: 400 var(--t-body)/1.4 var(--f-text); color: var(--st-ink2); margin-top: 1cqw; max-width: 22em; }
.rv { animation: rise .7s ease both; animation-delay: var(--d, 0s); }
@keyframes rise { from { opacity: 0; transform: translateY(1.2cqw); } }
/* Salida suave al retirar el accesorio */
.stage.saliendo .obj, .stage.saliendo .m-title, .stage.saliendo .m-pie, .stage.saliendo .blk { animation: salir .5s ease forwards; }
.stage.saliendo .threads { opacity: 0; transition: opacity .4s; }
@keyframes salir { to { opacity: 0; } }


/* dibujos de tejido */
.wire, .ring { display: none; }
.base { fill: var(--c); } .knit { fill: url(#knit); }
.handle { fill: none; stroke: var(--c); stroke-width: 7; stroke-linecap: round; }
.cap { fill: #D6DAE1; stroke: #7E8795; stroke-width: 1.5; } .cap-in { fill: none; stroke: #7E8795; stroke-width: 1.2; }
.hole { fill: var(--st-glass2, #141211); stroke: rgba(0,0,0,.4); stroke-width: 1.2; }
.fr { stroke: var(--c); stroke-width: 2.6; stroke-linecap: round; fill: none; }
.knot { fill: var(--c); stroke: rgba(0,0,0,.4); stroke-width: 1; }
.petal { fill: var(--crema); stroke: rgba(0,0,0,.3); stroke-width: .8; } .pc { fill: var(--magenta); }

@media (prefers-reduced-motion: reduce) { .mirror::after, .glow, .obj, .rv { animation: none !important; } .threads path, .threads circle { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
</style>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="knit" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 2 L5 8 L10 2" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.6"/>
      <path d="M0 1 L5 7 L10 1" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1"/>
    </pattern>
  </defs>
</svg>

<div class="pantalla" id="box">
  <div class="stage" id="stage">
    <svg class="wm" viewBox="0 0 384 410" aria-hidden="true"><g fill="currentColor">
      <path d="M79 50 L105 50 L197 376 L187 376Z M305 50 L279 50 L187 376 L197 376Z M185 50H199V376L192 392L185 376Z"/>
      <path d="M22 50 C22 34 62 33 118 40 L118 53 C84 49 52 47 38 60 C28 60 22 56 22 50Z M136 52 C136 36 172 36 192 41 C212 36 248 36 248 52 C236 46 214 47 192 53 C170 47 148 46 136 52Z M362 50 C362 34 322 33 266 40 L266 53 C300 49 332 47 346 60 C356 60 362 56 362 50Z"/></g>
      <path d="M72 138 L142 90 M162 134 L224 92 M250 136 L308 94" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/></svg>
    <div class="band top" id="bandTop" aria-hidden="true"></div>
    <div class="glow"></div>
    <div class="mirror" id="mirror"><video id="cam" class="cam" autoplay muted playsinline></video><div class="m-body" id="mBody"></div></div>
    <div class="m-box" id="mTitle"></div>
    <div class="m-foot" id="mFoot"></div>
    <div class="aviso" id="aviso"><p>Felipe prohibido iterar</p></div>
    <button id="btnLector" type="button">Conectar lector</button>
    <svg class="threads" id="threads" aria-hidden="true"></svg>
    <div class="col left" id="colL"></div>
    <div class="col right" id="colR"></div>
    <div class="band bot" id="bandBot" aria-hidden="true"></div>
  </div>
</div>

<script>
/* =========================================================
   1) CONFIGURACIÓN  ← lo que se edita para ajustar la instalación
   ========================================================= */
const CAMARA = true;           // true: al inicio el espejo muestra la cámara (la persona se ve). No se graba nada.
const TEXTO_EN_ESPERA = true;    // true: muestra "Hiladoras" y la invitación dentro de la proyección mientras no hay accesorio
const TIEMPOS = { inicio: 0.6, entreEtapas: 0.4 };   // segundos
const INACTIVIDAD = 3 * 60 * 1000;   // ms sin actividad para volver a la pantalla de inicio (3 minutos)
const RETIRO_DEMORA = 700;   // ms que el chip puede "parpadear" sin que se retire el proceso

      'Entre prueba y error hacen dos trabajos: uno del grupo, una sátira de la plasticidad de hoy, y otro con las tejedoras.',

/* =========================================================
   2) DIBUJOS DE EJEMPLO (reemplazables por fotos)
   ========================================================= */
const shape = d => `<path class="base" d="${d}"/><path class="knit" d="${d}"/>`;
const flower = (x, y, s = 1) => {
  let p = '';
  for (let i = 0; i < 5; i++) {
    const a = i * 72 * Math.PI / 180 - Math.PI / 2;
    p += `<circle class="petal" cx="${(x + Math.cos(a) * 5 * s).toFixed(1)}" cy="${(y + Math.sin(a) * 5 * s).toFixed(1)}" r="${(4.2 * s).toFixed(1)}"/>`;
  }
  return p + `<circle class="pc" cx="${x}" cy="${y}" r="${(2.6 * s).toFixed(1)}"/>`;
};
const DIBUJOS = {
  bolso: { vb: '10 30 140 160', svg: () =>
    '<path class="handle" d="M50 86 C48 38 112 38 110 86"/>'
    + shape('M28 86 H132 L126 172 Q125 184 113 184 H47 Q35 184 34 172 Z')
    + [[52, 114], [80, 114], [108, 114], [66, 140], [94, 140], [80, 166]]
        .map(([x, y]) => `<circle class="cap" cx="${x}" cy="${y}" r="10"/><circle class="cap-in" cx="${x}" cy="${y}" r="5"/>`).join('') },
  collar: { vb: '10 52 140 118', svg: () => {
    const up = t => 62 + 92 * t * (1 - t), lo = t => 84 + 92 * t * (1 - t);
    let k = '', f = '';
    for (let i = 1; i < 10; i++) {
      const t = i / 10, x = 20 + 120 * t, y = (up(t) + lo(t)) / 2;
      k += `<path class="knot" d="M${x} ${y - 5.5} L${x + 5} ${y} L${x} ${y + 5.5} L${x - 5} ${y} Z"/>`;
    }
    for (let i = 0; i < 11; i++) {
      const t = 0.04 + i * 0.092, x = 20 + 120 * t, y = lo(t), len = 30 + (i % 3) * 8;
      f += `<path class="fr" d="M${x.toFixed(1)} ${y.toFixed(1)} q${i % 2 ? 2 : -2} ${len / 2} 0 ${len}"/>`;
    }
    return f + shape('M20 62 Q80 108 140 62 L140 84 Q80 130 20 84 Z') + k; } },
  pulsera: { vb: '10 50 140 100', svg: () =>
    '<path class="base" fill-rule="evenodd" d="M18 100 a62 46 0 1 0 124 0 a62 46 0 1 0 -124 0 Z M36 100 a44 30 0 1 1 88 0 a44 30 0 1 1 -88 0 Z"/>'
    + '<path class="knit" fill-rule="evenodd" d="M18 100 a62 46 0 1 0 124 0 a62 46 0 1 0 -124 0 Z M36 100 a44 30 0 1 1 88 0 a44 30 0 1 1 -88 0 Z"/>'
    + flower(80, 62, 1.15) + flower(126, 82, .95) + flower(34, 82, .95) + flower(112, 130, .85) + flower(48, 130, .85) + flower(80, 138, 1.1) }
};
const dibujoSVG = a => `<svg viewBox="${DIBUJOS[a.dibujo].vb}" role="img" aria-label="Dibujo de ${a.nombre}">${DIBUJOS[a.dibujo].svg()}</svg>`;
const imagen = a => a.foto
  ? `<img src="${a.foto}" alt="${a.nombre}" onerror="this.outerHTML=dibujoSVG(ACCESORIOS.find(q => q.id==='${a.id}'))">`
  : `<svg viewBox="${DIBUJOS[a.dibujo].vb}" role="img" aria-label="Dibujo de ${a.nombre}">${DIBUJOS[a.dibujo].svg()}</svg>`;

/* Borde de punto cruz (# = puntada). Cada flor es una grilla de 9 × 9. */
const MOTIVO = [
  '....#....',
  '..#.#.#..',
  '..##.##..',
  '.#..#..#.',
  '####.####',
  '.#..#..#.',
  '..##.##..',
  '..#.#.#..',
  '....#....'];
function dibujarBorde(el, n) {
  const celda = 4, ancho = MOTIVO[0].length + 2, tiles = n || 50;
  let r = '';
  for (let t = 0; t < tiles; t++) MOTIVO.forEach((fila, y) => [...fila].forEach((c, x) => {
    if (c === '#') r += `<rect x="${(t * ancho + x + 1) * celda}" y="${(y + 1) * celda}" width="${celda - .6}" height="${celda - .6}"/>`;
  }));
  el.innerHTML = `<svg viewBox="0 0 ${tiles * ancho * celda} ${(MOTIVO.length + 2) * celda}" fill="url(#gband)"><defs><linearGradient id="gband" gradientUnits="userSpaceOnUse" x1="0" x2="${tiles * ancho * celda}" y1="0" y2="0"><stop offset="0" stop-color="#E48B4E"/><stop offset=".34" stop-color="#B34E53"/><stop offset=".67" stop-color="#875A87"/><stop offset="1" stop-color="#3D6F83"/></linearGradient></defs>${r}</svg>`;
}

/* =========================================================
   3) INTERACCIÓN
   ========================================================= */
let actual = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const buscar = ref => ACCESORIOS.find(a => a.id === ref || a.chip === ref);

// El lector de chips de la mesa llama a estas dos funciones.
let tRetiro, tSalida;
function colocarAccesorio(ref) {
  const a = buscar(ref); if (!a) { console.warn('Chip no reconocido:', ref); return; }
  clearTimeout(tRetiro); clearTimeout(tSalida); $('#stage').classList.remove('saliendo');
  if (actual && actual.id === a.id) return;          // el mismo chip releído no reinicia la animación
  actual = a; reiniciarInactividad(); render();
}
function retirarAccesorio(ya) {
  clearTimeout(tRetiro); if (!actual) return;
  reiniciarInactividad();
  tRetiro = setTimeout(() => {
    $('#stage').classList.add('saliendo');
    tSalida = setTimeout(() => { actual = null; $('#stage').classList.remove('saliendo'); render(); }, 550);
  }, ya ? 0 : RETIRO_DEMORA);
}
window.colocarAccesorio = colocarAccesorio;
window.retirarAccesorio = retirarAccesorio;

/* Inactividad: si pasan INACTIVIDAD ms sin que cambie el accesorio ni se toque una tecla, vuelve a la pantalla de inicio. */
let tInactivo;
function reiniciarInactividad() {
  clearTimeout(tInactivo);
  tInactivo = setTimeout(() => {
    $('#aviso').classList.remove('on');
    if (actual) retirarAccesorio(true);
  }, INACTIVIDAD);
}
['keydown', 'pointerdown', 'pointermove', 'touchstart'].forEach(ev => addEventListener(ev, reiniciarInactividad, { passive: true }));
reiniciarInactividad();

function renderMirror() {
  const m = $('#mirror'); m.classList.toggle('hay-obj', !!actual);
  if (!actual) {
    $('#mTitle').innerHTML = ''; $('#mFoot').innerHTML = '';
    $('#mBody').innerHTML = `<div class="wait"><span class="halo"></span>${TEXTO_EN_ESPERA ? '<p>Pon un accesorio sobre la mesa</p>' : ''}</div>`;
    return;
  }
  $('#mBody').innerHTML = `<div class="obj ${actual.ancho ? 'wide' : ''}">${imagen(actual)}</div>`;
  $('#mFoot').innerHTML = `<div class="m-pie rv" style="--d:.5s"><b>${esc(actual.grupo)}</b><span>${(actual.estudiantes || []).map(esc).join(' · ')}</span></div>`;
}

function renderInfo() {
  const L = $('#colL'), R = $('#colR');
  if (!actual && !TEXTO_EN_ESPERA) { L.innerHTML = ''; R.innerHTML = ''; return; }
  if (!actual) {
    L.innerHTML = `<div class="blk rv" style="--o:1"><p class="idle-brand">Hiladoras</p><p class="idle-sub">La colaboración</p></div>`;
    R.innerHTML = `<div class="blk rv" style="--o:2"><h2 class="idle-title">Cada puntada es una historia contada</h2>
      <p class="idle-text">Pon un accesorio sobre la mesa y el espejo te mostrará cómo se hizo: las etapas, los materiales y las decisiones de cada grupo.</p></div>`;
    return;
  }
  const a = actual, T = TIEMPOS, pend = '<p class="pending">Por completar con el grupo.</p>';
  const tj = a.tejedoras || [], est = a.estudiantes || [], et = a.etapas || [];
  const d = i => `${(T.inicio + i * T.entreEtapas).toFixed(2)}s`;
  const b = (i, o, inner, hilo = true) => `<div class="blk rv" ${hilo ? 'data-hilo' : ''} style="--d:${d(i)};--o:${o}">${inner}</div>`;
  L.innerHTML = ETAPAS.map((n, i) => b(1 + i, 2 + i, `<span class="st">0${i + 1} · ${n}</span>${et[i] ? `<p>${esc(et[i])}</p>` : pend}`)).join('');
  R.innerHTML =
    b(5, 6, `<div class="label">Materiales</div>${a.materiales ? `<p>${esc(a.materiales)}</p>` : pend}`)
    + b(6, 7, `<div class="label">Decisiones</div>${a.decisiones ? `<p>${esc(a.decisiones)}</p>` : pend}`)
    + b(7, 8, `<div class="label">${tj.length > 1 ? 'Tejedoras' : 'Tejedora'} · habilidad especial</div>${tj.length ? `<div class="tj">${tj.map(w => `<div><b>${esc(w.n)}</b><span>${esc(w.s || '')}</span></div>`).join('')}</div>` : pend}`)
    + b(8, 9, `<div class="label">Lo que se llevaron</div>${a.aprendizaje ? `<p>${esc(a.aprendizaje)}</p>` : pend}`);
}

/* Si un texto largo no cabe en su columna, baja el tamaño de todo el texto de la proyección hasta que quepa. */
function ajustarTexto() {
  const st = $('#stage');
  st.style.setProperty('--fit', 1);
  const sobra = () => [...document.querySelectorAll('.col')].some(c => {
    const k = c.children; if (!k.length) return false;
    return (k[k.length - 1].offsetTop + k[k.length - 1].offsetHeight - k[0].offsetTop) > c.clientHeight;
  });
  let fit = 1;
  while (sobra() && fit > .6) { fit = +(fit - .03).toFixed(2); st.style.setProperty('--fit', fit); }
}

/* Hilos: unen cada bloque con el borde del óvalo (se recalculan según el tamaño de la pantalla). */
function pos(el, stage) { let x = 0, y = 0; while (el && el !== stage) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; }
/* Trenza de dos hebras: se cruzan y alternan quién pasa por encima (la que va por debajo se corta un instante). */
function trenza(x0, y0, mid, y1, xr, dl, sw) {
  const P = 8, L = Math.abs(xr - x0) + Math.abs(y1 - y0), ondas = Math.max(3, Math.round(L / (sw * .024))), A = sw * .0036, n = ondas * 2 * P, cruces = ondas * 2;
  let a = '', b = '', ca = false, cb = false;
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    const x = u*u*u*x0 + 3*u*u*t*mid + 3*u*t*t*mid + t*t*t*xr, y = u*u*u*y0 + 3*u*u*t*y0 + 3*u*t*t*y1 + t*t*t*y1;
    const dx = 3*u*u*(mid - x0) + 3*t*t*(xr - mid), dy = 6*u*t*(y1 - y0), d = Math.hypot(dx, dy) || 1;
    const o = A * Math.sin(Math.PI * t) * Math.sin(Math.PI * cruces * t), nx = -dy / d * o, ny = dx / d * o;
    const j = Math.round(i / P), cerca = Math.abs(i - j * P) <= 1 && j > 0 && j < cruces;
    const sa = cerca && j % 2 === 1, sb = cerca && j % 2 === 0;           // dónde se corta cada hebra
    if (sa) ca = false; else { a += `${ca ? 'L' : 'M'}${(x + nx).toFixed(1)} ${(y + ny).toFixed(1)}`; ca = true; }
    if (sb) cb = false; else { b += `${cb ? 'L' : 'M'}${(x - nx).toFixed(1)} ${(y - ny).toFixed(1)}`; cb = true; }
  }
  return `<path d="${a}" data-d="${dl}"/><path class="h2" d="${b}" data-d="${dl}"/>`;
}
function dibujarHilos(animar = true) {
  const svg = $('#threads'), stage = $('#stage');
  svg.innerHTML = '';
  if (!actual) return;
  const sw = stage.clientWidth, sh = stage.clientHeight, m = $('#mirror');
  const W = m.offsetWidth, H = m.offsetHeight, cx = sw / 2, top = sh / 2 + sw * .02 - H / 2;   // el espejo baja 2cqw para dejar lugar al título
  const rx = W / 2, yc = top + rx, ryT = rx;                                  // arco: semicírculo arriba, lados rectos abajo
  const rim = (y, lado) => { const k = y < yc ? (yc - y) / ryT : 0; return cx + lado * rx * Math.sqrt(Math.max(0, 1 - k * k)); };
  let out = ''; const ult = { '-1': -1e9, '1': -1e9 };   // último punto usado en cada lado, para que los hilos no se junten
  document.querySelectorAll('[data-hilo]').forEach(bl => {
    const col = bl.parentElement, lado = col.classList.contains('left') ? -1 : 1, f = bl.firstElementChild;
    const pb = pos(bl, stage), pf = pos(f, stage);
    const y0 = pf.y + f.offsetHeight / 2;
    const x0 = lado < 0 ? pb.x + bl.offsetWidth + sw * .006 : pb.x - sw * .006;
    let y1 = Math.min(Math.max(y0, top + .14 * H), top + .93 * H); y1 = Math.min(Math.max(y1, ult[lado] + sw * .03), top + .96 * H); ult[lado] = y1;
    const xr = rim(y1, lado) + lado * sw * .018, mid = (x0 + xr) / 2;   // el hilo se detiene antes del borde
    const dl = parseFloat(bl.style.getPropertyValue('--d')) + .15;
    out += trenza(x0, y0, mid, y1, xr, dl, sw)
         + `<circle cx="${xr.toFixed(1)}" cy="${y1.toFixed(1)}" r="${(sw * .0042).toFixed(1)}" data-d="${dl}"/>`;
  });
  svg.setAttribute('viewBox', `0 0 ${sw} ${sh}`);
  svg.style.setProperty('--hilo', (sw * .0012).toFixed(2) + 'px');
  svg.innerHTML = out;
  if (!animar) return;
  svg.querySelectorAll('path').forEach(p => { const n = p.getTotalLength(); p.style.strokeDasharray = n; p.style.strokeDashoffset = n; p.style.animation = `draw .9s ease ${p.dataset.d}s forwards`; });
  svg.querySelectorAll('circle').forEach(c => { c.style.opacity = 0; c.style.animation = `pop .4s ease ${(+c.dataset.d + .7).toFixed(2)}s forwards`; });
}

function render() {
  const s = $('#stage'); s.classList.remove('t-witral', 't-amanopla', 't-petroleo'); if (actual && actual.tema) s.classList.add(actual.tema);   // sin accesorio: naranja (Hiladoras)
  $('#stage').classList.toggle('activo', !!actual);
  $('#stage').style.setProperty('--acc', actual ? `var(--c-${actual.id}, ${actual.color})` : 'var(--st-label)');
  renderMirror(); renderInfo();
  requestAnimationFrame(() => { ajustarTexto(); dibujarHilos(true); });
}

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= ACCESORIOS.length) { $('#aviso').classList.remove('on'); colocarAccesorio(ACCESORIOS[n - 1].id); }
  else if (e.key === '9') $('#aviso').classList.toggle('on');   // pantalla solo con el mensaje
  else if (e.key === 'Escape') { $('#aviso').classList.remove('on'); retirarAccesorio(true); }
  else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
});

dibujarBorde($('#bandTop')); dibujarBorde($('#bandBot'));
/* La proyección se dibuja siempre en un lienzo de 1920 × 1080 y se escala para llenar la pantalla (centrada, sin deformarse). */
function escalar() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('#stage');
  st.style.left = ((innerWidth - 1920 * k) / 2) + 'px';
  st.style.top = ((innerHeight - 1080 * k) / 2) + 'px';
  st.style.transform = `scale(${k})`;
}
addEventListener('resize', escalar); escalar();
document.fonts && document.fonts.ready.then(() => { ajustarTexto(); dibujarHilos(false); });
/* Lector Arduino por USB (Web Serial, Chrome/Edge). El Arduino manda una línea por evento:
   CHIP-COLLAR · CHIP-BOLSO · CHIP-PULSERA  → colocarAccesorio    RETIRAR → retirarAccesorio */
const BAUDIOS = 9600;
let lectorConectado = false;
async function leerPuerto(puerto) {
  await puerto.open({ baudRate: BAUDIOS });
  lectorConectado = true; $('#btnLector').classList.add('ok');
  const dec = new TextDecoderStream(); puerto.readable.pipeTo(dec.writable).catch(() => {});
  const lector = dec.readable.getReader(); let buf = '';
  try {
    for (;;) {
      const { value, done } = await lector.read(); if (done) break;
      buf += value; let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const linea = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (linea === 'RETIRAR') retirarAccesorio();
        else if (buscar(linea)) colocarAccesorio(linea);
      }
    }
  } catch (e) { console.warn('Lector desconectado:', e.message); }
  lectorConectado = false; $('#btnLector').classList.remove('ok');
}
async function conectarLector() {
  if (!('serial' in navigator)) { alert('Este navegador no soporta Web Serial. Usa Chrome o Edge.'); return; }
  if (lectorConectado) return;
  try { leerPuerto(await navigator.serial.requestPort()); } catch (e) { console.warn('Conexión cancelada:', e.message); }
}
document.body.appendChild($('#btnLector'));   // fuera del lienzo escalado, para que quede fijo en la esquina de la pantalla
$('#btnLector').addEventListener('click', conectarLector);
addEventListener('keydown', e => { if ((e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey) conectarLector(); });
if ('serial' in navigator) navigator.serial.getPorts().then(ps => { if (ps.length) leerPuerto(ps[0]).catch(e => console.warn(e.message)); });   // reconecta solo si ya diste permiso antes

async function iniciarCamara() {
  if (!CAMARA || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const v = $('#cam');
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    await v.play().catch(() => {});
    $('#mirror').classList.add('cam-on');
  } catch (e) { console.warn('Cámara no disponible (el espejo queda en espera):', e.message); }
}
render();   // parte en espera, sin accesorio (como después de Esc)
iniciarCamara();
</script>
